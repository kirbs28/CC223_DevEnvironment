<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase CRUD</title>
</head>
<body>
    <div class="container">
        <h2>Firebase CRUD App</h2>

        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">
        <button onclick="addUser()">Add User</button>

        <h3>Users List:</h3>
        <ul id="userList"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, getDocs, onSnapshot, 
            doc, updateDoc, deleteDoc 
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAD10xy2k_kutfb24NnLcKQ4IF7TUeTEPI",
            authDomain: "mycrudapp-2ebc0.firebaseapp.com",
            projectId: "mycrudapp-2ebc0",
            storageBucket: "mycrudapp-2ebc0.appspot.com",
            messagingSenderId: "164453236210",
            appId: "1:164453236210:web:0a402a8ce6cfcd42c9bf6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const usersCollection = collection(db, "users");

        window.addUser = async function() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;

            if (name && email) {
                try {
                    await addDoc(usersCollection, { name, email });
                    alert("User added successfully!");
                    document.getElementById("name").value = "";
                    document.getElementById("email").value = "";
                } catch (error) {
                    console.error("Error adding user: ", error);
                    alert("Error adding user.");
                }
            } else {
                alert("Please enter name and email.");
            }
        };

        window.updateUser = async function(id, currentName, currentEmail) {
            const newName = prompt("Enter new name:", currentName);
            const newEmail = prompt("Enter new email:", currentEmail);

            if (newName && newEmail) {
                try {
                    const userDoc = doc(db, "users", id);
                    await updateDoc(userDoc, { name: newName, email: newEmail });
                    alert("User updated successfully!");
                } catch (error) {
                    console.error("Error updating user: ", error);
                }
            }
        };

        window.deleteUser = async function(id) {
            if (confirm("Are you sure you want to delete this user?")) {
                try {
                    const userDoc = doc(db, "users", id);
                    await deleteDoc(userDoc);
                    alert("User deleted successfully!");
                } catch (error) {
                    console.error("Error deleting user: ", error);
                }
            }
        };

        onSnapshot(usersCollection, (snapshot) => {
            const userList = document.getElementById("userList");
            userList.innerHTML = ""; 

            snapshot.forEach(doc => {
                const userData = doc.data();
                const li = document.createElement("li");
                li.innerHTML = `
                    ${userData.name} - ${userData.email} 
                    <button class="update-btn" onclick="updateUser('${doc.id}', '${userData.name}', '${userData.email}')">Update</button>
                    <button class="delete-btn" onclick="deleteUser('${doc.id}')">Delete</button>
                `;
                userList.appendChild(li);
            });
        });
    </script>
</body>
</html>
